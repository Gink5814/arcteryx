name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run isolated tests without retailer requests or email
        shell: bash
        run: |
          python - <<'PY'
          import sys
          import unittest
          suite = unittest.defaultTestLoader.discover('tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          for test, detail in result.failures + result.errors:
              message = (test.id() + '\n' + detail).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Unit test failure::{message}')
          sys.exit(not result.wasSuccessful())
          PY

  browser:
    name: Chromium browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install browser test tools outside the repository
        run: |
          npm install --prefix "$RUNNER_TEMP/arcteryx-browser" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/arcteryx-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check JavaScript and run the synthetic browser fixture
        run: |
          node --check src/arcteryx_prices/static/app.js
          node --check tests/frontend.e2e.cjs
          NODE_PATH="$RUNNER_TEMP/arcteryx-browser/node_modules" node tests/frontend.e2e.cjs
