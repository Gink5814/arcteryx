name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run isolated tests without retailer requests or email
        run: python -m unittest discover -s tests -v

  browser:
    name: Chromium browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools outside the repository
        run: |
          npm install --prefix "$RUNNER_TEMP/arcteryx-browser" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/arcteryx-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check JavaScript and run the synthetic browser fixture
        run: |
          node --check src/arcteryx_prices/static/app.js
          node --check tests/frontend.e2e.cjs
          NODE_PATH="$RUNNER_TEMP/arcteryx-browser/node_modules" node tests/frontend.e2e.cjs
